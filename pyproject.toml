[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go-evaluation-contract-audit"
version = "0.4.0"
description = "Evidence-aware auditing of Gene Ontology prediction evaluation contracts"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6.0,<7"]

[project.scripts]
goaudit = "go_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
go_audit = ["audit.schema.json"]
